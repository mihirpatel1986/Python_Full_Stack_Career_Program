<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamer Tag | ShadowX</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="profile-card">
      <img
        src="https://i.pravatar.cc/160?img=12"
        alt="Gamer avatar"
        class="avatar"
      />

      <h1>ShadowX</h1>
      <p class="tagline">🎮 Play hard. Stay legendary.</p>
      <p class="bio">FPS enthusiast | Streamer | PC Gamer</p>

      <nav class="social-links" aria-label="Gaming profiles">
        <a
          class="social twitch"
          href="https://www.twitch.tv/yourusername"
          target="_blank"
          rel="noopener noreferrer"
        >
          Twitch
        </a>

        <a
          class="social discord"
          href="https://discord.com/users/youruserid"
          target="_blank"
          rel="noopener noreferrer"
        >
          Discord
        </a>

        <a
          class="social steam"
          href="https://steamcommunity.com/id/yourusername"
          target="_blank"
          rel="noopener noreferrer"
        >
          Steam
        </a>
      </nav>

      <p class="footer">GG WP • See you in the lobby!</p>
    </main>
  </body>
</html>
