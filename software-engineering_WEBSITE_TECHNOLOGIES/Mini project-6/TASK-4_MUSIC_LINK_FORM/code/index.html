<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Links Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <h1>My Music Links</h1>
      <p>Add your music profiles to create preview cards.</p>

      <form id="musicLinksForm">
        <label for="spotify">Spotify Profile URL</label>
        <input
          type="url"
          id="spotify"
          placeholder="https://open.spotify.com/user/username"
        />

        <label for="youtube">YouTube Music URL</label>
        <input
          type="url"
          id="youtube"
          placeholder="https://music.youtube.com/channel/..."
        />

        <label for="apple">Apple Music URL</label>
        <input
          type="url"
          id="apple"
          placeholder="https://music.apple.com/profile/username"
        />

        <button type="submit">Create Preview Cards</button>
      </form>

      <p id="message" role="status"></p>
      <div id="previewCards" class="preview-cards"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
