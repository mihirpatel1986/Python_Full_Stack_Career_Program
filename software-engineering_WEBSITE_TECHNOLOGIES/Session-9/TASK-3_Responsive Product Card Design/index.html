<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3 - Product Card Design</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="h2 mb-4">Responsive Product Card Design</h1>
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-4">
        <article class="product-card">
          <span class="badge bg-danger product-badge">Best Seller</span>
          <img src="https://placehold.co/600x400/f0eaff/573a91?text=Bluetooth+Speaker" alt="Bluetooth speaker" class="product-image">
          <div class="p-3">
            <h2 class="h5">Bluetooth Speaker</h2>
            <p class="rating">★★★★★ <span class="text-secondary">(124 reviews)</span></p>
            <p class="text-secondary">Portable sound with powerful bass.</p>
            <div class="d-flex justify-content-between align-items-center">
              <strong class="fs-5">₹1,799</strong>
              <button class="btn btn-dark">Shop Now</button>
            </div>
          </div>
        </article>
      </div>
    </div>
  </main>
</body>
</html>
