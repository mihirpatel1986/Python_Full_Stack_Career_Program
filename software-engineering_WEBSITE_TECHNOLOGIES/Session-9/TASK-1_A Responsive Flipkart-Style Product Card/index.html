<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 - Flipkart Product Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="h2 mb-4">Flipkart-Style Product Card</h1>
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-4">
        <article class="product-card">
          <img src="https://placehold.co/600x400/eaf2ff/164a8a?text=Headphones" alt="Wireless headphones" class="product-image">
          <div class="p-3">
            <h2 class="h5">Wireless Headphones</h2>
            <p class="text-secondary">Comfortable fit with clear, rich sound.</p>
            <p class="price">₹1,499</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </article>
      </div>
    </div>
  </main>
</body>
</html>
