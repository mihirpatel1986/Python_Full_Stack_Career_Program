<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Responsive Product Card Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="h2 mb-4">Responsive Product Card Layout</h1>
    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-4">
        <article class="product-card">
          <img src="https://placehold.co/600x400/eaf2ff/164a8a?text=Headphones" alt="Headphones" class="product-image">
          <div class="p-3"><h2 class="h5">Wireless Headphones</h2><p>Enjoy your favourite music anywhere.</p><strong>₹1,499</strong></div>
        </article>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <article class="product-card">
          <img src="https://placehold.co/600x400/eaf8ed/23733b?text=Smart+Watch" alt="Smart watch" class="product-image">
          <div class="p-3"><h2 class="h5">Smart Watch</h2><p>Track activity and daily fitness goals.</p><strong>₹2,299</strong></div>
        </article>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <article class="product-card">
          <img src="https://placehold.co/600x400/fff3e5/99520b?text=Backpack" alt="Backpack" class="product-image">
          <div class="p-3"><h2 class="h5">Everyday Backpack</h2><p>A lightweight bag for school and travel.</p><strong>₹899</strong></div>
        </article>
      </div>
    </div>
  </main>
</body>
</html>
