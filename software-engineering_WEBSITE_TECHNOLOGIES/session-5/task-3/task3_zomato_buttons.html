<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Zomato Style Buttons</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f4f6f9; color: #222; }
    main { max-width: 800px; margin: auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { color: #263f73; }
    .note { color: #596579; }

    .zomato-button { border: 0; padding: 12px 20px; margin: 4px; border-radius: 8px; color: white; background: #e23744; font-size: 1rem; cursor: pointer; transition: background-color .2s, transform .2s; }
    .zomato-button:hover { background: #b91f2b; transform: translateY(-2px); }

  </style>
</head>
<body>
<main>
  <h1>Task 3 - Zomato Style Buttons</h1>

  <p>These buttons use the same styling and change color when hovered over.</p>
  <button class="zomato-button" type="button">Order Food</button>
  <button class="zomato-button" type="button">View Restaurants</button>
  <p class="note">For this one-file task, the CSS is inside the HTML. Normally, place it in styles.css and link it with a &lt;link&gt; tag.</p>

</main>

</body>
</html>
