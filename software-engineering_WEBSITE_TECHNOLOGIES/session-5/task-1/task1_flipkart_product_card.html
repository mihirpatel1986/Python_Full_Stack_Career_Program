<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Flipkart Product Card</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f4f6f9; color: #222; }
    main { max-width: 800px; margin: auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { color: #263f73; }
    .note { color: #596579; }

    .product-card { width: 280px; max-width: 100%; padding: 18px; border: 1px solid #ddd; border-radius: 10px; text-align: center; background: #fff; }
    .product-icon { font-size: 4rem; }

  </style>
</head>
<body>
<main>
  <h1>Task 1 - Flipkart Product Card</h1>

  <section class="product-card">
    <div class="product-icon" aria-hidden="true">🎧</div>
    <h2 style="background-color: #fff2cc; font-size: 26px; padding: 8px; color: #173b70;">Wireless Headphones</h2>
    <p>Clear sound • Comfortable fit</p>
    <strong>₹1,499</strong>
  </section>
  <p class="note">Inline CSS sets the product title's background color and font size.</p>

</main>

</body>
</html>
