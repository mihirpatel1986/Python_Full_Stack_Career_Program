<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Myntra Offer Banner</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f4f6f9; color: #222; }
    main { max-width: 800px; margin: auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { color: #263f73; }
    .note { color: #596579; }

    .offer-banner { padding: 24px; border-radius: 8px; background: #fff0f5; color: #9b174c; font-family: Georgia, serif; text-align: center; }
    .offer-banner strong { font-size: 1.4rem; }

  </style>
</head>
<body>
<main>
  <h1>Task 2 - Myntra Offer Banner</h1>

  <section class="offer-banner">
    <strong>FASHION SALE — UP TO 50% OFF</strong>
    <p>Refresh your wardrobe with styles you love.</p>
  </section>
  <p class="note">Internal CSS sets the banner's font family, text color, and background color.</p>

</main>

</body>
</html>
