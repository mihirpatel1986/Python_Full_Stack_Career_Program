<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Spotify Playlist Selectors</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f4f6f9; color: #222; }
    main { max-width: 800px; margin: auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { color: #263f73; }
    .note { color: #596579; }

    .playlist { padding: 16px; border-radius: 10px; background: #171717; color: white; }
    .playlist-item { padding: 12px; margin: 6px 0; border-radius: 6px; background: #292929; color: white; }
    #currently-playing { background: #1db954; color: #071b0d; font-weight: bold; }

  </style>
</head>
<body>
<main>
  <h1>Task 4 - Spotify Playlist Selectors</h1>

  <section class="playlist">
    <div class="playlist-item">1. Blinding Lights — The Weeknd</div>
    <div class="playlist-item" id="currently-playing">▶ 2. As It Was — Harry Styles (Currently Playing)</div>
    <div class="playlist-item">3. Levitating — Dua Lipa</div>
    <div class="playlist-item">4. Starboy — The Weeknd</div>
  </section>
  <p class="note">The .playlist-item class styles every song; the #currently-playing ID highlights one song.</p>

</main>

</body>
</html>
