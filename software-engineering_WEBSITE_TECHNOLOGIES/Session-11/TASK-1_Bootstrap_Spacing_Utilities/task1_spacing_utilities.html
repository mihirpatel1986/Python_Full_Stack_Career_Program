<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1: Bootstrap Spacing Utilities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; }
    .demo-wrap { max-width: 900px; margin: 40px auto; padding: 24px; border-radius: 14px; }
    .demo-title { color: #174ea6; }
    
    @media(max-width:576px) { .demo-wrap { margin: 18px 10px; padding: 16px; } }
  </style>
</head>
<body class="bg-light">
  <main class="container demo-wrap bg-white text-dark shadow-sm">
    <h1 class="h3 fw-bold demo-title mb-4">Task 1: Bootstrap Spacing Utilities</h1>
    
    <div class="card shadow-sm">
      <div class="card-body">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80"
             alt="Wireless headphones" class="img-fluid rounded mb-3" style="max-height:220px;object-fit:contain">
        <h2 class="h5 fw-bold">Wireless Bluetooth Headphones</h2>
        <p class="text-secondary mb-0">A Flipkart-style product card showing three spacing levels.</p>
      </div>
    </div>
    <div class="mt-2 p-2 bg-primary-subtle rounded">Level 1: <code>mt-2 p-2</code> — small margin and padding.</div>
    <div class="mt-3 p-3 bg-success-subtle rounded">Level 2: <code>mt-3 p-3</code> — medium margin and padding.</div>
    <div class="mt-4 p-4 bg-warning-subtle rounded">Level 3: <code>mt-4 p-4</code> — larger margin and padding.</div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
