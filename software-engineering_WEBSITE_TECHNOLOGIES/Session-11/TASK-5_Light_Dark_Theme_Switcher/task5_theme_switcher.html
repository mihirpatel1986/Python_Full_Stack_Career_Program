<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5: Light / Dark Theme Switcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; }
    .demo-wrap { max-width: 900px; margin: 40px auto; padding: 24px; border-radius: 14px; }
    .demo-title { color: #174ea6; }
    
    #themeContainer { transition: background-color .2s ease, color .2s ease; }

    @media(max-width:576px) { .demo-wrap { margin: 18px 10px; padding: 16px; } }
  </style>
</head>
<body class="bg-light">
  <main class="container demo-wrap bg-white text-dark shadow-sm">
    <h1 class="h3 fw-bold demo-title mb-4">Task 5: Light / Dark Theme Switcher</h1>
    
    <div id="themeContainer" class="bg-light text-dark rounded p-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div><h2 class="h4 fw-bold mb-1">Customize Your Theme</h2><p class="mb-0">Switch between light and dark modes.</p></div>
        <button id="themeToggle" class="btn btn-dark" type="button" aria-pressed="false">Enable Dark Mode</button>
      </div>
      <hr>
      <p class="mb-0">This container toggles Bootstrap's <code>bg-light</code>/<code>bg-dark</code> and <code>text-dark</code>/<code>text-light</code> classes for readable contrast.</p>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const themeContainer = document.getElementById("themeContainer");
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", function () {
      const darkMode = themeContainer.classList.contains("bg-light");
      themeContainer.classList.toggle("bg-light", !darkMode);
      themeContainer.classList.toggle("text-dark", !darkMode);
      themeContainer.classList.toggle("bg-dark", darkMode);
      themeContainer.classList.toggle("text-light", darkMode);
      themeToggle.classList.toggle("btn-dark", !darkMode);
      themeToggle.classList.toggle("btn-light", darkMode);
      themeToggle.textContent = darkMode ? "Enable Light Mode" : "Enable Dark Mode";
      themeToggle.setAttribute("aria-pressed", String(darkMode));
    });
  </script>

</body>
</html>
