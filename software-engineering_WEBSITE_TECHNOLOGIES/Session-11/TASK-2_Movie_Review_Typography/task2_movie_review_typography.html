<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2: Movie Review Card & Typography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; }
    .demo-wrap { max-width: 900px; margin: 40px auto; padding: 24px; border-radius: 14px; }
    .demo-title { color: #174ea6; }
    
    @media(max-width:576px) { .demo-wrap { margin: 18px 10px; padding: 16px; } }
  </style>
</head>
<body class="bg-light">
  <main class="container demo-wrap bg-white text-dark shadow-sm">
    <h1 class="h3 fw-bold demo-title mb-4">Task 2: Movie Review Card & Typography</h1>
    
    <div class="card border-0 shadow-sm">
      <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1000&q=80"
           class="card-img-top" alt="Movie theater" style="max-height:300px;object-fit:cover">
      <div class="card-body p-4">
        <p class="text-uppercase text-primary fw-semibold small mb-2">Featured Review</p>
        <h2 class="display-6 fw-bold mb-2">The Midnight Premiere</h2>
        <p class="fs-5 fw-semibold text-warning mb-3">★ 4.5 / 5</p>
        <p class="lead mb-3">A gripping cinematic experience with stunning visuals and memorable performances.</p>
        <p class="small text-secondary mb-0">Reviewed by MovieFan · 23 October 2026</p>
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
