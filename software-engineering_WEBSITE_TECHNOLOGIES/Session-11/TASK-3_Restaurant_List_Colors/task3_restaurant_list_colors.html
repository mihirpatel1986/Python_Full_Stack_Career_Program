<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3: Restaurant List with Bootstrap Colors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; }
    .demo-wrap { max-width: 900px; margin: 40px auto; padding: 24px; border-radius: 14px; }
    .demo-title { color: #174ea6; }
    
    @media(max-width:576px) { .demo-wrap { margin: 18px 10px; padding: 16px; } }
  </style>
</head>
<body class="bg-light">
  <main class="container demo-wrap bg-white text-dark shadow-sm">
    <h1 class="h3 fw-bold demo-title mb-4">Task 3: Restaurant List with Bootstrap Colors</h1>
    
    <div class="list-group">
      <article class="list-group-item p-3">
        <div class="d-flex justify-content-between gap-3">
          <div><h2 class="h5 fw-bold mb-1">Spice Garden</h2><p class="text-secondary mb-0">Indian · North Indian</p></div>
          <span class="badge text-bg-success align-self-start">4.6 ★</span>
        </div>
        <div class="mt-3 d-flex flex-wrap gap-2"><span class="badge text-bg-danger">20% OFF</span><span class="badge text-bg-success">Open Now</span></div>
      </article>
      <article class="list-group-item p-3">
        <div class="d-flex justify-content-between gap-3">
          <div><h2 class="h5 fw-bold mb-1">Urban Pizza</h2><p class="text-secondary mb-0">Italian · Pizza</p></div>
          <span class="badge text-bg-primary align-self-start">4.3 ★</span>
        </div>
        <div class="mt-3 d-flex flex-wrap gap-2"><span class="badge text-bg-warning">Free Delivery</span><span class="badge text-bg-danger">Closed</span></div>
      </article>
      <article class="list-group-item p-3">
        <div class="d-flex justify-content-between gap-3">
          <div><h2 class="h5 fw-bold mb-1">Sweet Cravings</h2><p class="text-secondary mb-0">Desserts · Bakery</p></div>
          <span class="badge text-bg-success align-self-start">4.8 ★</span>
        </div>
        <div class="mt-3 d-flex flex-wrap gap-2"><span class="badge text-bg-info">Buy 1 Get 1</span><span class="badge text-bg-success">Open Now</span></div>
      </article>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
