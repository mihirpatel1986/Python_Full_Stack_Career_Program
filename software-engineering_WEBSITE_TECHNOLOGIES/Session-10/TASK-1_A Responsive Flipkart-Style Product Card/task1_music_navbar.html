<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1: Responsive Music Playlist Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f6f8fc; color:#263238; font-family:Arial,sans-serif; }
    .demo { max-width:900px; margin:40px auto; padding:24px; background:#fff; border:1px solid #e3e8ef; border-radius:12px; box-shadow:0 4px 14px #0000000d; }
    h1 { color:#174ea6; font-weight:700; margin-bottom:22px; }
    @media(max-width:576px) { .demo { margin:18px 10px; padding:16px; } }
  </style>
</head>
<body>
  <main class="demo">
    <h1 class="h3">Task 1: Responsive Music Playlist Navbar</h1>
    
    <style>
      .music-navbar{background:#121212;border-radius:8px}
      .music-navbar .navbar-brand{color:#1ed760;font-weight:800}
      .music-navbar .nav-link{color:#f5f5f5}
      .music-navbar .nav-link:hover,.music-navbar .nav-link:focus{color:#1ed760}
    </style>
    <nav class="navbar navbar-expand-lg navbar-dark music-navbar px-3">
      <a class="navbar-brand" href="#">♫ TuneBox</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#musicNavbar" aria-controls="musicNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="musicNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#playlists">Playlists</a></li>
          <li class="nav-item"><a class="nav-link" href="#profile">Profile</a></li>
        </ul>
      </div>
    </nav>
    <p class="text-secondary mt-3 mb-0">Responsive navbar with a mobile hamburger menu.</p>
    
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
