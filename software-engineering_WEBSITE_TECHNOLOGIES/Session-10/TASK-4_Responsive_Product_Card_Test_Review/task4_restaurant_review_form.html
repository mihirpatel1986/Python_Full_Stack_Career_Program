<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4: Restaurant Review Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f6f8fc; color:#263238; font-family:Arial,sans-serif; }
    .demo { max-width:900px; margin:40px auto; padding:24px; background:#fff; border:1px solid #e3e8ef; border-radius:12px; box-shadow:0 4px 14px #0000000d; }
    h1 { color:#174ea6; font-weight:700; margin-bottom:22px; }
    @media(max-width:576px) { .demo { margin:18px 10px; padding:16px; } }
  </style>
</head>
<body>
  <main class="demo">
    <h1 class="h3">Task 4: Restaurant Review Form</h1>
    
    <form id="reviewForm" class="mx-auto" style="max-width:620px">
      <div class="mb-3"><label for="reviewerName" class="form-label fw-semibold">Your Name</label><input type="text" class="form-control" id="reviewerName" placeholder="Enter your name" required></div>
      <div class="mb-3"><label for="rating" class="form-label fw-semibold">Rating</label>
        <select class="form-select" id="rating" required>
          <option value="" selected disabled>Choose a rating</option>
          <option value="5">★★★★★ - Excellent (5)</option><option value="4">★★★★☆ - Very Good (4)</option>
          <option value="3">★★★☆☆ - Good (3)</option><option value="2">★★☆☆☆ - Fair (2)</option><option value="1">★☆☆☆☆ - Poor (1)</option>
        </select>
      </div>
      <div class="mb-3"><label for="reviewMessage" class="form-label fw-semibold">Your Review</label><textarea class="form-control" id="reviewMessage" rows="4" placeholder="Tell us about your experience..." required></textarea></div>
      <button type="submit" class="btn btn-success">Submit Review</button>
      <p id="formMessage" class="mt-3 mb-0" role="status" aria-live="polite"></p>
    </form>
    
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    document.getElementById("reviewForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const name = document.getElementById("reviewerName").value.trim();
      const message = document.getElementById("formMessage");
      message.textContent = "Thank you, " + name + "! Your review has been recorded for this demo.";
      message.className = "text-success mt-3 mb-0";
      this.reset();
    });
  </script>
    
</body>
</html>
