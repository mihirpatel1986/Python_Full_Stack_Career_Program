<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3: Featured Movies Carousel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f6f8fc; color:#263238; font-family:Arial,sans-serif; }
    .demo { max-width:900px; margin:40px auto; padding:24px; background:#fff; border:1px solid #e3e8ef; border-radius:12px; box-shadow:0 4px 14px #0000000d; }
    h1 { color:#174ea6; font-weight:700; margin-bottom:22px; }
    @media(max-width:576px) { .demo { margin:18px 10px; padding:16px; } }
  </style>
</head>
<body>
  <main class="demo">
    <h1 class="h3">Task 3: Featured Movies Carousel</h1>
    
    <style>
      .movie-carousel{max-width:720px;margin:auto;border-radius:12px;overflow:hidden;background:#111}
      .movie-carousel .carousel-item img{height:360px;width:100%;object-fit:cover;opacity:.8}
      .movie-carousel .carousel-caption{background:#0009;border-radius:8px;padding:12px;bottom:22px}
      @media(max-width:576px){.movie-carousel .carousel-item img{height:250px}.movie-carousel .carousel-caption{bottom:8px;padding:8px}}
    </style>
    <div id="movieCarousel" class="carousel slide movie-carousel" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1200&q=80" alt="Cinema seats">
          <div class="carousel-caption"><h2 class="h5">The Big Screen</h2><p class="mb-0">Experience the magic of movies.</p></div>
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=1200&q=80" alt="Movie projector">
          <div class="carousel-caption"><h2 class="h5">Stories That Stay</h2><p class="mb-0">Discover your next favourite story.</p></div>
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=1200&q=80" alt="Movie theater screen">
          <div class="carousel-caption"><h2 class="h5">Now Showing</h2><p class="mb-0">Find a film for your next movie night.</p></div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Previous</span></button>
      <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Next</span></button>
    </div>
    
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
