<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2: Flipkart-Style Product Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f6f8fc; color:#263238; font-family:Arial,sans-serif; }
    .demo { max-width:900px; margin:40px auto; padding:24px; background:#fff; border:1px solid #e3e8ef; border-radius:12px; box-shadow:0 4px 14px #0000000d; }
    h1 { color:#174ea6; font-weight:700; margin-bottom:22px; }
    @media(max-width:576px) { .demo { margin:18px 10px; padding:16px; } }
  </style>
</head>
<body>
  <main class="demo">
    <h1 class="h3">Task 2: Flipkart-Style Product Card</h1>
    
    <style>
      .product-card{max-width:340px;border-radius:12px;overflow:hidden;transition:transform .2s,box-shadow .2s}
      .product-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0002}
      .product-card img{height:220px;object-fit:contain;padding:18px}
      .price{color:#198754;font-size:1.35rem;font-weight:700}
    </style>
    <div class="card product-card mx-auto">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="Wireless headphones">
      <div class="card-body">
        <span class="badge text-bg-primary mb-2">Best Seller</span>
        <h2 class="h5 card-title">Wireless Bluetooth Headphones</h2>
        <p class="card-text text-secondary">Comfortable fit with rich sound and long battery life.</p>
        <p class="price">₹1,499 <small class="text-secondary text-decoration-line-through fs-6">₹2,999</small></p>
        <a href="#buy" class="btn btn-primary w-100">Buy Now</a>
      </div>
    </div>
    
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
