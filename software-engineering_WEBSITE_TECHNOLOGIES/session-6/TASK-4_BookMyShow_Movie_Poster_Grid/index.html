<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4: BookMyShow-Style Movie Poster Grid</title>
  <style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f5f5f5; }
.movie-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 20px; }
.movie-card { position: relative; overflow: hidden; border: 1px solid #ddd; border-radius: 10px; background: white; }
.movie-card img { display: block; width: 100%; height: 250px; object-fit: cover; }
.movie-info { padding: 12px; }
.movie-info h2 { margin: 0 0 5px; font-size: 17px; }
.movie-info p { margin: 0; color: #777; font-size: 14px; }
.new-badge { position: absolute; top: 10px; left: 10px; z-index: 1; padding: 5px 9px; color: white; background: #e53935; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <header><h1>Task 4: BookMyShow-Style Movie Poster Grid</h1></header>
  <main>
<h1>Now Showing</h1>
<div class="movie-grid">
  <article class="movie-card">
    <span class="new-badge">NEW</span>
    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80" alt="Movie theatre">
    <div class="movie-info"><h2>The Big Premiere</h2><p>Drama · 2h 10m</p></div>
  </article>
  <article class="movie-card">
    <img src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=600&q=80" alt="Cinema screen">
    <div class="movie-info"><h2>Beyond the Screen</h2><p>Adventure · 2h 05m</p></div>
  </article>
  <article class="movie-card">
    <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=600&q=80" alt="Film projector">
    <div class="movie-info"><h2>Last Show</h2><p>Thriller · 1h 55m</p></div>
  </article>
</div>
  </main>
</body>
</html>
