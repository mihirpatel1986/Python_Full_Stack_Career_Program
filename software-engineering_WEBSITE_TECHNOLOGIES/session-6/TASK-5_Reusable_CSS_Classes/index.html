<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5: Refactor CSS with Reusable Classes</title>
  <style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f5f5f5; }
.demo-card { max-width: 420px; margin-left: auto; margin-right: auto; border: 1px solid #ddd; border-radius: 10px; background: white; }
.p-3 { padding: 16px; }             /* Reusable standard padding */
.p-2 { padding: 8px; }               /* Reusable small padding */
.mb-3 { margin-bottom: 16px; }       /* Reusable bottom margin */
.no-bottom-margin { margin-bottom: 0; }
.footer { background: #f0f5ff; border-radius: 0 0 10px 10px; }
  </style>
</head>
<body>
  <header><h1>Task 5: Refactor CSS with Reusable Classes</h1></header>
  <main>
<article class="demo-card mb-3">
  <div class="p-3">
    <h2>Reusable Spacing Example</h2>
    <p class="no-bottom-margin">This card uses shared utility classes for consistent spacing.</p>
  </div>
  <footer class="p-2 footer">Footer uses a smaller reusable padding class.</footer>
</article>
<article class="demo-card p-3">
  <h2>Another Card</h2>
  <p class="no-bottom-margin">The same spacing classes can be reused here.</p>
</article>
<!-- Maintainability: update a shared class once instead of editing many selectors. -->
  </main>
</body>
</html>
