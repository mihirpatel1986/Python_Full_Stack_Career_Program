<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="product-card">
      <img
        src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcQMis5R1OLNJANdIUlRicSDIBIVoCzESkT7IZKq5kYayzi5uKlLedcwFVug7qileqR3VL2uds0gYCrPJYxGh62sy649lD-tmp2U5uY49DB6o-Qc2tCzszOzbVZq7EvHZg_-rnHGSg&usqp=CAc"
        alt="Product Image"
        class="product-image"
      />

      <h2>Wireless Headphones</h2>

      <p class="description">
        Experience high-quality sound with our wireless headphones. Enjoy
        freedom of movement and superior audio performance.
      </p>

      <p class="rating">4.5 ⭐ | 1,250 Ratings</p>

      <div class="price">
        <span class="current-price">$99.99</span>
        <span class="original-price">$149.99</span>
        <span class="discount">33% Off</span>
      </div>

      <p class="offer">Limited Time Offer: Free Shipping!</p>

      <button class="add-to-cart">Buy now</button>
    </div>
  </body>
</html>
