<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1: Music Artist Bio Landing Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --brand:#6c4cf1; --brand-dark:#5035c7; --ink:#20243a; --soft:#f5f4ff; }
    body { font-family:Arial,sans-serif; color:var(--ink); background:#f7f8fc; }
    .demo-wrap { max-width:1100px; margin:32px auto; padding:24px; background:#fff; border-radius:16px; box-shadow:0 5px 24px #18203a12; }
    .brand-text { color:var(--brand); }
    .btn-brand { background:var(--brand); color:#fff; border-color:var(--brand); }
    .btn-brand:hover { background:var(--brand-dark); color:#fff; border-color:var(--brand-dark); }
    .section-title { font-weight:800; letter-spacing:-.03em; }
    
    .artist-photo{width:160px;height:160px;object-fit:cover;border:5px solid var(--soft);box-shadow:0 8px 24px #6c4cf133}
    .artist-bio{max-width:620px}

    @media(max-width:576px) { .demo-wrap { margin:12px; padding:16px; } }
  </style>
</head>
<body>

  <main class="container demo-wrap text-center py-5">
    <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=500&q=85"
      class="artist-photo rounded-circle mb-4" alt="Music artist portrait">
    <p class="text-uppercase small fw-bold brand-text mb-2">Independent Artist</p>
    <h1 class="display-5 fw-bold mb-3">Alex Rivers</h1>
    <p class="lead text-secondary mx-auto artist-bio">Singer, songwriter, and storyteller creating soulful melodies for late-night drives and new beginnings.</p>
    <div class="d-flex justify-content-center flex-wrap gap-2 mt-4">
      <a class="btn btn-dark" href="#instagram"><i class="bi bi-instagram me-2"></i>Instagram</a>
      <a class="btn btn-primary" href="#spotify"><i class="bi bi-spotify me-2"></i>Spotify</a>
      <a class="btn btn-danger" href="#youtube"><i class="bi bi-youtube me-2"></i>YouTube</a>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
