<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4: Sticky Navigation Bar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --brand:#6c4cf1; --brand-dark:#5035c7; --ink:#20243a; --soft:#f5f4ff; }
    body { font-family:Arial,sans-serif; color:var(--ink); background:#f7f8fc; }
    .demo-wrap { max-width:1100px; margin:32px auto; padding:24px; background:#fff; border-radius:16px; box-shadow:0 5px 24px #18203a12; }
    .brand-text { color:var(--brand); }
    .btn-brand { background:var(--brand); color:#fff; border-color:var(--brand); }
    .btn-brand:hover { background:var(--brand-dark); color:#fff; border-color:var(--brand-dark); }
    .section-title { font-weight:800; letter-spacing:-.03em; }
    
    .site-nav{background:#24213f}
    html{scroll-behavior:smooth;scroll-padding-top:72px}

    @media(max-width:576px) { .demo-wrap { margin:12px; padding:16px; } }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top site-nav">
    <div class="container"><a class="navbar-brand fw-bold" href="#home">BioBeat</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="siteNav"><ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#home">Home</a></li><li class="nav-item"><a class="nav-link" href="#about">About</a></li><li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul></div>
    </div>
  </nav>
  <main class="container demo-wrap">
    <section id="home" class="py-4"><h1 class="section-title">Welcome to BioBeat</h1><p class="lead text-secondary">A simple landing page for music, playlists, and artist stories.</p></section>
    <section id="about" class="py-5 border-top"><h2 class="h3 fw-bold">About</h2><p>BioBeat brings your artist profile, favourite playlists, and music updates together in one place.</p></section>
    <section id="contact" class="py-5 border-top"><h2 class="h3 fw-bold">Contact</h2><p class="mb-0">Email: hello@example.com</p></section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
