<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2: Featured Playlists Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --brand:#6c4cf1; --brand-dark:#5035c7; --ink:#20243a; --soft:#f5f4ff; }
    body { font-family:Arial,sans-serif; color:var(--ink); background:#f7f8fc; }
    .demo-wrap { max-width:1100px; margin:32px auto; padding:24px; background:#fff; border-radius:16px; box-shadow:0 5px 24px #18203a12; }
    .brand-text { color:var(--brand); }
    .btn-brand { background:var(--brand); color:#fff; border-color:var(--brand); }
    .btn-brand:hover { background:var(--brand-dark); color:#fff; border-color:var(--brand-dark); }
    .section-title { font-weight:800; letter-spacing:-.03em; }
    
    .playlist-card{border-radius:14px;overflow:hidden;transition:transform .2s}
    .playlist-card:hover{transform:translateY(-4px)}
    .playlist-card .card-img-top{height:190px;object-fit:cover}

    @media(max-width:576px) { .demo-wrap { margin:12px; padding:16px; } }
  </style>
</head>
<body>

  <main class="container demo-wrap">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-4">
      <div><p class="text-uppercase small fw-bold brand-text mb-1">Made for your mood</p><h1 class="section-title h2 mb-0">Featured Playlists</h1></div>
      <span class="text-secondary">Fresh sounds, anytime</span>
    </div>
    <div class="row g-4">
      <div class="col-12 col-md-4"><article class="card h-100 border-0 shadow-sm playlist-card">
        <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Concert lights">
        <div class="card-body"><h2 class="h5 fw-bold">Electric Nights</h2><p class="text-secondary">High-energy tracks for your night out.</p><a href="#listen-electric" class="btn btn-brand">Listen Now</a></div>
      </article></div>
      <div class="col-12 col-md-4"><article class="card h-100 border-0 shadow-sm playlist-card">
        <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Starry night sky">
        <div class="card-body"><h2 class="h5 fw-bold">Midnight Calm</h2><p class="text-secondary">Soft melodies for slow evenings.</p><a href="#listen-calm" class="btn btn-brand">Listen Now</a></div>
      </article></div>
      <div class="col-12 col-md-4"><article class="card h-100 border-0 shadow-sm playlist-card">
        <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Live music festival">
        <div class="card-body"><h2 class="h5 fw-bold">Festival Favourites</h2><p class="text-secondary">Big choruses and crowd-pleasing hits.</p><a href="#listen-festival" class="btn btn-brand">Listen Now</a></div>
      </article></div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
